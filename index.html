<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muro da Liberdade — Plano de Execução</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10161F;
    --surface: #16202B;
    --surface-raised: #1C2836;
    --line: #2A3A49;
    --brass: #C9A227;
    --brass-dim: #7A6A30;
    --teal: #4A8B8C;
    --ink: #E8E4D9;
    --ink-dim: #8FA0AC;
    --brick-off: #24303D;
    --brick-on: #C9A227;
    --danger: #B5654A;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 28px 28px;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    padding-bottom:80px;
  }
  .wrap{max-width:720px;margin:0 auto;padding:28px 18px 40px;}

  header.top{margin-bottom:22px;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  #today-date{color:var(--ink-dim);}
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:28px;
    margin:10px 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{color:var(--ink-dim);font-size:14px;line-height:1.5;margin:0;}

  /* ---- Brick wall signature ---- */
  .wall-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 18px 14px;
    margin-top:18px;
  }
  .wall-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .wall-label b{color:var(--brass);font-weight:600;}
  .wall{
    display:grid;
    grid-template-columns:repeat(10, 1fr);
    gap:3px;
    max-height:280px;
    overflow-y:auto;
    padding-right:2px;
  }
  .wall::-webkit-scrollbar{width:5px;}
  .wall::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .brick{
    aspect-ratio:2/1;
    background:var(--brick-off);
    border-radius:2px;
    transition:background .4s ease, transform .3s ease;
  }
  .brick.on{
    background:linear-gradient(160deg, #E0BC49, var(--brick-on));
    box-shadow:0 0 0 1px rgba(0,0,0,.15) inset;
  }
  .brick.today-marker{
    box-shadow:0 0 0 2px var(--teal);
  }

  /* ---- Daily base decree ---- */
  .decree-card{
    background:linear-gradient(180deg, var(--surface-raised), var(--surface));
    border:1px solid var(--line);
    border-left:3px solid var(--brass);
    border-radius:10px;
    padding:20px;
    margin-top:16px;
  }
  .decree-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--brass);
    margin-bottom:8px;
    display:block;
  }
  .decree-text{
    font-family:'Fraunces', serif;
    font-size:19px;
    line-height:1.45;
    font-weight:600;
    color:var(--ink);
    margin:0 0 16px;
  }
  .toggles{display:flex;gap:10px;flex-wrap:wrap;}
  .toggle-btn{
    flex:1;
    min-width:140px;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    letter-spacing:.03em;
    padding:11px 12px;
    border-radius:7px;
    cursor:pointer;
    text-align:left;
    display:flex;
    align-items:center;
    gap:8px;
    transition:all .15s ease;
  }
  .toggle-btn .box{
    width:14px;height:14px;border-radius:3px;
    border:1.5px solid var(--ink-dim);
    flex-shrink:0;
  }
  .toggle-btn.checked{
    background:rgba(201,162,39,0.1);
    border-color:var(--brass);
    color:var(--ink);
  }
  .toggle-btn.checked .box{
    background:var(--brass);
    border-color:var(--brass);
  }
  .toggle-btn:active{transform:scale(0.98);}

  .close-day-row{
    margin-top:16px;
  }
  .close-day-btn{
    width:100%;
    background:var(--surface);
    border:1.5px solid var(--line);
    color:var(--ink-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:13px 12px;
    border-radius:8px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .close-day-btn.ready{
    background:linear-gradient(160deg, #E0BC49, var(--brick-on));
    border-color:var(--brick-on);
    color:#10161F;
    font-weight:700;
  }
  .close-day-btn:active{transform:scale(0.98);}
  .close-day-hint{
    margin:8px 0 0;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.02em;
    color:var(--ink-dim);
    text-align:center;
  }
  .week-done-msg{
    font-family:'Fraunces', serif;
    font-size:16px;
    color:var(--ink);
    text-align:center;
    padding:8px 0 2px;
  }

  .reflect{
    margin-top:12px;
  }
  .reflect label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-dim);
    margin-bottom:6px;
  }
  .reflect textarea{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    padding:10px;
    resize:vertical;
    min-height:44px;
  }
  .reflect textarea:focus{outline:1px solid var(--teal);}

  /* ---- Week section ---- */
  .week-head{
    margin-top:34px;
    margin-bottom:4px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .week-head h2{
    font-family:'Fraunces', serif;
    font-size:20px;
    font-weight:700;
    margin:0;
  }
  .week-progress-text{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--teal);
  }
  .week-bar{
    height:5px;
    background:var(--surface);
    border-radius:3px;
    overflow:hidden;
    margin:10px 0 20px;
    border:1px solid var(--line);
  }
  .week-bar-fill{
    height:100%;
    background:linear-gradient(90deg, var(--brass-dim), var(--brass));
    width:0%;
    transition:width .5s ease;
  }

  .day-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 16px 15px;
    margin-bottom:10px;
    transition:border-color .2s ease;
  }
  .day-card.done{
    border-color:var(--brass-dim);
    background:linear-gradient(180deg, rgba(201,162,39,0.06), var(--surface));
  }
  .day-top{
    display:flex;
    align-items:flex-start;
    gap:12px;
    cursor:pointer;
  }
  .day-check{
    width:22px;height:22px;
    border-radius:5px;
    border:1.5px solid var(--ink-dim);
    flex-shrink:0;
    margin-top:2px;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s ease;
  }
  .day-card.done .day-check{
    background:var(--brass);
    border-color:var(--brass);
  }
  .day-check svg{opacity:0;width:13px;height:13px;transition:opacity .15s;}
  .day-card.done .day-check svg{opacity:1;}
  .day-meta{flex:1;}
  .day-num{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--teal);
    margin-bottom:3px;
  }
  .day-decree{
    font-family:'Fraunces', serif;
    font-size:15.5px;
    font-weight:600;
    line-height:1.4;
    margin:0 0 6px;
    color:var(--ink);
  }
  .day-card.done .day-decree{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:var(--brass-dim);}
  .day-action{
    font-size:13.5px;
    line-height:1.5;
    color:var(--ink-dim);
    margin:0;
  }
  .day-action b{color:var(--ink);font-weight:600;}
  .day-card.locked{opacity:.4;}
  .day-card.locked .day-top{cursor:default;}
  .day-card.active .day-top{cursor:pointer;}
  .day-card.active{border-color:var(--teal);}
  .day-hint{
    margin:8px 0 0;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.02em;
    color:var(--teal);
  }
  .day-hint.blocked{color:var(--danger);}

  /* ---- History / log ---- */
  .history-toggle-row{
    margin-top:28px;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .history-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
  }
  .history-btn:hover{border-color:var(--teal);color:var(--teal);}
  .history-card{
    margin-top:14px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
  }
  .history-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:12px;
  }
  .history-empty{color:var(--ink-dim);font-size:13px;}
  .history-item{
    padding:10px 0;
    border-top:1px solid var(--line);
  }
  .history-item:first-child{border-top:none;}
  .history-date{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--teal);
    margin-bottom:3px;
  }
  .history-note{font-size:13.5px;color:var(--ink);line-height:1.5;}
  .history-note i{color:var(--ink-dim);}

  /* ---- Roadmap strip ---- */
  .roadmap{
    margin-top:36px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
  }
  .roadmap-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:12px;
  }
  .roadmap-grid{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .rm-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:7px 8px;
    border-radius:6px;
    font-size:12.5px;
  }
  .rm-item.active{background:rgba(201,162,39,0.1);}
  .rm-num{
    font-family:'JetBrains Mono', monospace;
    color:var(--ink-dim);
    width:20px;
    flex-shrink:0;
  }
  .rm-item.active .rm-num{color:var(--brass);}
  .rm-name{color:var(--ink-dim);}
  .rm-item.active .rm-name{color:var(--ink);font-weight:600;}
  .rm-item.done .rm-num::after{content:"✓";margin-left:2px;color:var(--brass-dim);}

  .reset-row{
    margin-top:28px;
    text-align:center;
  }
  .reset-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
  }
  .reset-btn:hover{border-color:var(--danger);color:var(--danger);}

  .loading{
    text-align:center;
    padding:60px 0;
    color:var(--ink-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading" id="loading">carregando plano…</div>
</div>

  {decree:"Minha rede é meu terreno fértil. Eu cultivo relações antes de precisar delas.",
   action:"Reconecte-se hoje com 1 contato que pode abrir uma porta — uma mensagem genuína, sem pedir nada, só reatando o vínculo."},
  {decree:"Eu recebo com a mesma dignidade com que dou. Aceitar ajuda não me diminui.",
   action:"Aceite hoje 1 ajuda, elogio ou oferta sem desviar ou minimizar. Perceba o desconforto e deixe ele passar sem recusar."},

   action:"Dê hoje 1 passo em direção a um risco calculado que você vem adiando (um investimento pequeno, uma conversa, uma inscrição, um início)."},
  {decree:"Eu solto a escassez soltando algo com generosidade. O que eu retenho com medo, eu não multiplico.",
   action:"Doe algo hoje — tempo, conhecimento, dinheiro ou um objeto — como um ato consciente de abundância, sem esperar retorno."},
  {decree:"Eu reconheço as portas que se abriram, mesmo as pequenas, porque é assim que aprendo a enxergá-las.",
   action:"Revise a semana e liste toda oportunidade que apareceu, por menor que fosse. Escreva o que você fará com pelo menos uma delas."}
];

const WEEK7_DAYS = [
  {decree:"Eu me ancoro antes de agir. O que nasce do centro é mais forte do que o que nasce da pressa.",
   action:"Reserve os primeiros 10 minutos do dia para silêncio, oração ou meditação, antes de qualquer tela ou tarefa."},
  {decree:"Meu 'não' protege meu 'sim' mais importante. Fronteira não é rejeição, é cuidado.",
   action:"Diga não hoje para 1 coisa que te drena e não te serve — um compromisso, uma pessoa, uma tarefa que não é sua."},
  {decree:"Eu escolho conscientemente o que — e quem — tem acesso à minha energia.",
   action:"Identifique 1 ambiente, conteúdo ou influência tóxica na sua rotina e reduza deliberadamente sua exposição a ela hoje."},
  {decree:"Minha fé é uma âncora, não um enfeite. Eu a alimento como alimento o corpo.",
   action:"Leia, ouça ou escreva algo hoje que fortaleça sua fé ou seus valores mais profundos — dedique ao menos 15 minutos só a isso."},
  {decree:"Eu solto o que carrego para poder seguir mais leve. Ressentimento guardado só me pesa a mim.",
   action:"Escreva uma carta (sem precisar enviar) para alguém que você precisa perdoar — ou para si mesmo. Coloque no papel o que está soltando."},
  {decree:"Meu ritual diário é o fio que me conecta a algo maior do que a urgência do dia.",
   action:"Crie um pequeno ritual espiritual diário (respiração, gratidão, oração, caminhada em silêncio) e pratique ele hoje do início ao fim."},
  {decree:"Eu observo meu estado interior com a mesma atenção que dou às minhas tarefas.",
   action:"Reflita por escrito sobre como estava seu estado interior essa semana — mais centrado ou mais reativo — e o que sustentou os momentos bons."}
];

const WEEK8_DAYS = [
  {decree:"Eu existo para algo maior do que sobreviver ao dia. Meu propósito não é um luxo, é uma bússola.",
   action:"Escreva um rascunho da sua missão pessoal em 2-3 frases: por que você existe, o que quer construir, para quem."},
  {decree:"O que eu deixo para trás fala mais alto do que o que eu acumulo.",
   action:"Escreva o que você quer que digam sobre você daqui a 20 anos — como pai/mãe, parceiro, profissional, ser humano."},
  {decree:"Eu alinho meus dias ao meu propósito, um ajuste de cada vez.",
   action:"Identifique 1 atividade do seu dia a dia que está desalinhada do seu propósito e faça 1 ajuste concreto nela hoje."},
  {decree:"Meu propósito se prova no que eu ofereço aos outros, não só no que busco pra mim.",
   action:"Faça hoje 1 ação de serviço genuína, alinhada ao seu propósito — ajudar, ensinar, doar tempo ou conhecimento a alguém que precisa."},
  {decree:"Meu maior talento é uma ferramenta que eu escolho usar com intenção, não guardar por medo.",
   action:"Identifique seu talento mais forte e use ele deliberadamente hoje em algo que realmente importa — não só no automático do trabalho."},
  {decree:"Eu transformo 8 semanas de decretos em 1 compromisso que carrego comigo.",
   action:"Releia as lições das últimas 8 semanas e escreva, em 1 página, seu credo pessoal — os princípios que você decide viver a partir de hoje."},
  {decree:"Eu celebro o caminho percorrido porque celebrar também é disciplina — e sigo, porque o muro continua sendo construído.",
   action:"Celebre esse primeiro ciclo de 56 dias de alguma forma concreta. Revise os 8 objetivos e escreva a intenção do próximo ciclo."}
];

const WEEKS = [
  {title: ROADMAP[0], days: WEEK1_DAYS},
  {title: ROADMAP[1], days: WEEK2_DAYS},
  {title: ROADMAP[2], days: WEEK3_DAYS},
  {title: ROADMAP[3], days: WEEK4_DAYS},
  {title: ROADMAP[4], days: WEEK5_DAYS},
  {title: ROADMAP[5], days: WEEK6_DAYS},
  {title: ROADMAP[6], days: WEEK7_DAYS},
  {title: ROADMAP[7], days: WEEK8_DAYS}
];

const DAYS_PER_WEEK = 7;
const PROGRAM_LENGTH = WEEKS.length * DAYS_PER_WEEK; // 56 dias — 1 ciclo pelos 8 objetivos
const YEAR_TOTAL = 365;
// dias acumulados ao fim de cada mês (ano não-bissexto) — usado pra revelar o muro em blocos de ~28-31 dias
const MONTH_CUM = [31,59,90,120,151,181,212,243,273,304,334,365];

// posição atual dentro do ciclo de 8 semanas, a partir do total de dias já fechados
function getProgramPosition(){
  const total = state.currentDay;
  const round = Math.floor(total / PROGRAM_LENGTH) + 1;
  const posInRound = total % PROGRAM_LENGTH;
  const weekIndex = Math.floor(posInRound / DAYS_PER_WEEK);
  const dayIndex = posInRound % DAYS_PER_WEEK;
  return {round, weekIndex, dayIndex};
}

// quantos tijolos ficam visíveis no muro, crescendo a cada mês (28-31 dias) até os 365 do ano
function visibleWallSlots(){
  const total = state.currentDay;
  for(const cum of MONTH_CUM){ if(total < cum) return cum; }
  return YEAR_TOTAL;
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtDatePt(str){
  const [y,m,d] = str.split("-");
  return d+"/"+m+"/"+y;
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let state = {
  base: {morning:false, night:false, action:false, note:""},  // toques do decreto base do ciclo atual (não são por data — resetam a cada dia concluído)
  currentDay: 0,      // total de dias já fechados desde o início (0-364) — avança pelas 8 semanas e recomeça o ciclo até fechar o ano
  cycles: [],          // ["YYYY-MM-DD", ...] — uma entrada por dia completo (cada entrada = 1 tijolo aceso)
  log: []              // [{date, week, weekTitle, weekDay, decree, action, note, timestamp}, ...] — histórico de anotações
};

async function loadState(){
  try{
    const raw = localStorage.getItem('daily-base');
    if(raw){
      const parsed = JSON.parse(raw);
      state.base = {morning:!!parsed.morning, night:!!parsed.night, action:!!parsed.action, note:parsed.note||""};
    }
  }catch(e){ /* no data yet */ }
  try{
    const raw = localStorage.getItem('progress');
    if(raw){
      const parsed = JSON.parse(raw);
      state.currentDay = parsed.currentDay || 0;
      state.cycles = parsed.cycles || [];
      state.log = parsed.log || [];
    }
  }catch(e){ /* no data yet */ }
}

async function saveBase(){
  try{ localStorage.setItem('daily-base', JSON.stringify(state.base)); }
  catch(e){ console.error('erro ao salvar base', e); }
}
async function saveProgress(){
  try{
    localStorage.setItem('progress', JSON.stringify({
      currentDay: state.currentDay,
      cycles: state.cycles,
      log: state.log
    }));
  }catch(e){ console.error('erro ao salvar progresso', e); }
}

function render(){
  const today = todayStr();
  const rec = state.base;
  const streak = state.cycles.length;
  const yearComplete = state.currentDay >= YEAR_TOTAL;
  const {round, weekIndex, dayIndex} = getProgramPosition();
  const currentWeek = WEEKS[weekIndex];
  const doneCount = dayIndex; // dias já fechados dentro da semana atual
  const baseComplete = rec.morning && rec.night && rec.action;

  // muro: cresce em blocos de ~28-31 dias (meses do ano) até mostrar os 365 tijolos
  const visibleSlots = visibleWallSlots();
  let bricksHtml = "";
  for(let i=0;i<visibleSlots;i++){
    const on = i < state.cycles.length;
    const isNext = i === state.cycles.length;
    bricksHtml += `<div class="brick ${on?'on':''} ${isNext?'today-marker':''}"></div>`;
  }

  const dayCardsHtml = currentWeek.days.map((day, idx)=>{
    const isDone = idx < dayIndex;
    const isActive = idx === dayIndex && !yearComplete;
    const isLocked = idx > dayIndex;
    const stateClass = isDone ? 'done' : (isLocked ? 'locked' : 'active');
    return `
    <div class="day-card ${stateClass}" data-day="${idx}">
      <div class="day-top">
        <div class="day-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="#10161F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="day-meta">
          <div class="day-num">Dia ${idx+1} de 7${isLocked?' · bloqueado':''}${isActive?' · hoje':''}</div>
          <p class="day-decree">"${day.decree}"</p>
          <p class="day-action"><b>Ação:</b> ${day.action}</p>
        </div>
      </div>
    </div>`;
  }).join("");

  const historyHtml = state.log.length
    ? state.log.slice().reverse().map(e=>`
        <div class="history-item">
          <div class="history-date">${fmtDatePt(e.date)} · Semana ${e.week||1} · Dia ${e.weekDay} — ${e.weekTitle||ROADMAP[0]}</div>
          <div class="history-note">${e.note ? escapeHtml(e.note) : '<i>sem anotação</i>'}</div>
        </div>`).join("")
    : `<div class="history-empty">Nenhum registro ainda. Ele aparece aqui assim que você concluir o primeiro dia.</div>`;

  const roadmapHtml = ROADMAP.map((name, idx)=>{
    const weekNum = idx+1;
    const isActive = idx===weekIndex && !yearComplete;
    const isDone = idx<weekIndex || (idx===weekIndex && yearComplete) || round>1;
    return `<div class="rm-item ${isActive?'active':''} ${isDone?'done':''}">
      <span class="rm-num">S${weekNum}</span>
      <span class="rm-name">${name}</span>
    </div>`;
  }).join("");

  document.getElementById('app').innerHTML = `
    <header class="top">
      <div class="eyebrow">
        <span>Plano de Execução — 12 Meses</span>
        <span id="today-date">${fmtDatePt(today)}</span>
      </div>
      <h1>Muro da Liberdade</h1>
      <p class="sub">Cada dia marcado é um tijolo. O muro não se constrói de uma vez — se constrói tijolo após tijolo, todos os dias.</p>

      <div class="wall-card">
        <div class="wall-label">
          <span>${streak}/${YEAR_TOTAL} tijolos${round>1?' · ciclo '+round:''}</span>
          <span>sequência atual: <b>${streak} ${streak===1?'dia':'dias'}</b></span>
        </div>
        <div class="wall">${bricksHtml}</div>
      </div>
    </header>

    <div class="decree-card">
      <span class="decree-tag">Decreto Base · Diário</span>
      <p class="decree-text">"Eu sou o homem que age. Cada escolha de hoje é um tijolo da liberdade da minha família. Eu ajo mesmo com medo, mesmo cansado, mesmo sozinho."</p>
      ${yearComplete ? `<p class="week-done-msg">🎉 Ano completo! Você fechou os 365 tijolos do Muro da Liberdade, passando pelos 8 objetivos ${round-1} ${round-1===1?'vez':'vezes'}. Use o botão "reiniciar" se quiser começar um novo ano do zero.</p>` : `
      <div class="toggles">
        <button class="toggle-btn ${rec.morning?'checked':''}" onclick="window.__toggleBase('morning')">
          <span class="box"></span> Manhã — falado 3x em voz alta
        </button>
        <button class="toggle-btn ${rec.night?'checked':''}" onclick="window.__toggleBase('night')">
          <span class="box"></span> Noite — revisão feita
        </button>
        <button class="toggle-btn ${rec.action?'checked':''}" onclick="window.__toggleBase('action')">
          <span class="box"></span> Ação do dia — concluída
        </button>
      </div>
      <div class="reflect">
        <label>Que ação de hoje honrou esse decreto?</label>
        <textarea id="reflection-input" placeholder="Escreva 1 frase antes de dormir… (isso vira o registro do dia quando você encerrar o dia)" onblur="window.__saveNote(this.value)">${rec.note||""}</textarea>
      </div>
      <div class="close-day-row">
        <button class="close-day-btn ${baseComplete?'ready':''}" onclick="window.__completeDay()">Encerrar o dia</button>
        ${!baseComplete ? `<p class="close-day-hint">Marque manhã, noite e ação do dia acima para liberar o encerramento.</p>` : ''}
      </div>
      `}
    </div>

    <div class="week-head">
      <h2>Semana ${weekIndex+1} · ${currentWeek.title}${round>1?' · Ciclo '+round:''}</h2>
      <span class="week-progress-text">${doneCount}/7</span>
    </div>
    <div class="week-bar"><div class="week-bar-fill" style="width:${(doneCount/7*100).toFixed(0)}%"></div></div>

    ${dayCardsHtml}

    <div class="roadmap">
      <div class="roadmap-label">Mapa das 8 semanas — onde você está</div>
      <div class="roadmap-grid">${roadmapHtml}</div>
    </div>

    <div class="history-toggle-row">
      <button class="history-btn" onclick="window.__toggleHistory()">${state.showHistory?'ocultar':'ver'} histórico de ações (${state.log.length})</button>
      <button class="history-btn" onclick="window.__copyHistoryJson()">copiar JSON</button>
      <button class="reset-btn" onclick="window.__resetAll()">reiniciar dados salvos</button>
    </div>
    ${state.showHistory ? `
    <div class="history-card">
      <div class="history-label">Histórico de ações — ${state.log.length} registro${state.log.length===1?'':'s'}</div>
      ${historyHtml}
    </div>` : ''}
  `;
}

window.__toggleBase = async function(field){
  state.base[field] = !state.base[field];
  render();
  await saveBase();
};

window.__saveNote = async function(val){
  state.base.note = val;
  await saveBase();
};

// Ao cumprir manhã + noite + ação do dia e encerrar: fecha o ciclo, acende o próximo tijolo,
// registra a anotação no histórico e reseta os toques pra serem ticados de novo no dia seguinte.
window.__completeDay = async function(){
  if(state.currentDay >= YEAR_TOTAL) return; // ano já completo
  if(!(state.base.morning && state.base.night && state.base.action)){
    alert("Marque manhã, noite e ação do dia antes de encerrar o dia.");
    return;
  }
  const {weekIndex, dayIndex} = getProgramPosition();
  const dayData = WEEKS[weekIndex].days[dayIndex];
  const today = todayStr();
  const note = state.base.note || "";

  state.log.push({
    date: today,
    week: weekIndex+1,
    weekTitle: WEEKS[weekIndex].title,
    weekDay: dayIndex+1,
    decree: dayData.decree,
    action: dayData.action,
    note: note,
    timestamp: new Date().toISOString()
  });
  state.cycles.push(today);                                   // acende o próximo tijolo
  state.currentDay = Math.min(state.currentDay+1, YEAR_TOTAL); // avança pro próximo dia (troca de semana/ciclo automaticamente)
  state.base = {morning:false, night:false, action:false, note:""};  // reseta os toggles pro próximo dia

  render();
  await saveProgress();
  await saveBase();
};

window.__toggleHistory = function(){
  state.showHistory = !state.showHistory;
  render();
};

window.__copyHistoryJson = async function(){
  const json = JSON.stringify(state.log, null, 2);
  try{
    await navigator.clipboard.writeText(json);
    alert("Histórico copiado como JSON (" + state.log.length + " registros).");
  }catch(e){
    alert(json); // fallback: mostra o JSON pra copiar manualmente
  }
};

window.__resetAll = async function(){
  if(!confirm("Isso vai apagar todo o progresso salvo neste dispositivo, incluindo o histórico de ações. Confirma?")) return;
  state = {base:{morning:false, night:false, action:false, note:""}, currentDay:0, cycles:[], log:[], showHistory:false};
  render();
  await saveBase();
  await saveProgress();
};

(async function init(){
  await loadState();
  render();
})();

})();
</script>
